# `cargo deny` configuration. Advisory-only in CI (see the `audit` job): a new
# advisory against a transitive dependency is worth knowing about and is not
# worth blocking an unrelated pull request over.

[advisories]
ignore = []

[licenses]
# The workspace is MIT. These are the licences it is willing to depend on --
# permissive ones, plus the Unicode data licence that `unicode-ident` carries
# and that half of crates.io transitively pulls in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# Not "deny" -- a GTK-era dependency tree has several versions of everything and
# a browser is not the place to fight that battle. Listed so the intent is on the
# record rather than implied by silence.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
