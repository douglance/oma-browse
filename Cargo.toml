[workspace]
resolver = "3"
members = ["crates/oma-theme", "crates/oma-browse"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/douglance/oma-browse"

[workspace.dependencies]
oma-theme = { path = "crates/oma-theme" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
