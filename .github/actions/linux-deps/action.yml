name: Linux build dependencies
description: >
  The system libraries a WebKitGTK browser needs to compile. Factored out of
  ci.yml because three jobs need the identical list and a list that drifts
  between jobs produces a failure in one of them that looks like a code problem.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        # webkit2gtk-4.1 specifically, not 4.0: `webkit2gtk-sys` 2.0 links
        # against the 4.1 pkg-config name, which is also the one wry uses.
        # libsoup3 comes with it and libjavascriptcoregtk-4.1 with that.
        sudo apt-get install --no-install-recommends -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libcairo2-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          xvfb \
          dbus-x11 \
          libssl-dev \
          build-essential \
          pkg-config
